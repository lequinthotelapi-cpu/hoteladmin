<div class="page-container">
  <div class="page-header">
    <h1>Gestión de Notificaciones</h1>
    <p>Enviar notificaciones personalizadas a usuarios</p>
  </div>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" fxLayout="column" fxLayoutGap="16px">
        
        <div fxLayout="row" fxLayoutGap="16px">
          <mat-form-field fxFlex>
            <mat-label>Usuario Destinatario</mat-label>
            <mat-select formControlName="userId">
              <mat-option *ngFor="let user of users" [value]="user.uid">
                {{ user.firstName }} {{ user.lastName }} ({{ user.email }})
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field fxFlex>
            <mat-label>Tipo</mat-label>
            <mat-select formControlName="type">
              <mat-option *ngFor="let type of notificationTypes" [value]="type.value">
                {{ type.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field fxFlex>
            <mat-label>Prioridad</mat-label>
            <mat-select formControlName="priority">
              <mat-option *ngFor="let priority of priorities" [value]="priority.value">
                {{ priority.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <mat-form-field>
          <mat-label>Título</mat-label>
          <input matInput formControlName="title" placeholder="Título de la notificación">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Mensaje</mat-label>
          <textarea matInput formControlName="message" rows="3" placeholder="Contenido del mensaje"></textarea>
        </mat-form-field>

        <mat-form-field>
          <mat-label>URL de Acción (Opcional)</mat-label>
          <input matInput formControlName="actionUrl" placeholder="/dashboard">
        </mat-form-field>

        <div fxLayout="row" fxLayoutGap="8px">
          <button mat-raised-button color="primary" (click)="sendNotification()" [disabled]="form.invalid || loading">
            <mat-icon>send</mat-icon>
            Enviar a Usuario
          </button>
          
          <button mat-raised-button color="accent" (click)="sendToAll()" [disabled]="loading">
            <mat-icon>group</mat-icon>
            Enviar a Todos
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
