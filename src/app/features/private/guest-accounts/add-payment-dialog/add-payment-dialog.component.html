<h2 mat-dialog-title>Registrar Pago</h2>

<mat-dialog-content>
  <div class="balance-info">
    <span class="balance-label">Saldo Pendiente:</span>
    <span class="balance-value">{{ data.balance | currency }}</span>
  </div>

  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Método de Pago</mat-label>
      <mat-select formControlName="method">
        <mat-option *ngFor="let method of paymentMethods" [value]="method.value">
          {{ method.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Monto</mat-label>
      <input matInput type="number" formControlName="amount" min="0" [max]="data.balance" step="0.01">
      <span matPrefix>$&nbsp;</span>
      <button mat-icon-button matSuffix (click)="payFull()" type="button" matTooltip="Pagar Total">
        <mat-icon>payments</mat-icon>
      </button>
      <mat-error *ngIf="form.get('amount')?.hasError('required')">
        El monto es requerido
      </mat-error>
      <mat-error *ngIf="form.get('amount')?.hasError('min')">
        El monto debe ser mayor a 0
      </mat-error>
      <mat-error *ngIf="form.get('amount')?.hasError('max')">
        El monto no puede exceder el saldo pendiente
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Referencia (Opcional)</mat-label>
      <input matInput formControlName="reference" placeholder="Ej: Voucher #456">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notas (Opcional)</mat-label>
      <textarea matInput formControlName="notes" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="loading">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="loading">
    <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
    <span *ngIf="!loading">Registrar Pago</span>
  </button>
</mat-dialog-actions>
