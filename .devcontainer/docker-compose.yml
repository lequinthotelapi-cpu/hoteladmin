version: '3.8'

services:
  angular-dev:
    container_name: lequint-angular-dev
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      # Código fuente - persiste en tu máquina
      - ..:/workspace:cached
      # node_modules - volumen persistente para velocidad
      - node_modules_cache:/workspace/node_modules
      # Cache npm - persiste entre sesiones
      - npm_cache:/root/.npm
      # Cache Angular - persiste builds
      - angular_cache:/workspace/.angular
      # Configuraciones globales
      - global_config:/root/.config
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - npm_config_registry=https://registry.npmjs.org/
      - npm_config_cache=/root/.npm
    working_dir: /workspace
    user: root
    command: sleep infinity

volumes:
  node_modules_cache:
  npm_cache:
  angular_cache:
  global_config:
