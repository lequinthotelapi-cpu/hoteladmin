<h2 mat-dialog-title>Agregar Cargo</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tipo de Cargo</mat-label>
      <mat-select formControlName="type">
        <mat-option *ngFor="let type of chargeTypes" [value]="type.value">
          {{ type.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="description" placeholder="Ej: Hamburguesa con papas">
      <mat-error *ngIf="form.get('description')?.hasError('required')">
        La descripción es requerida
      </mat-error>
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Precio Unitario</mat-label>
        <input matInput type="number" formControlName="amount" min="0" step="0.01">
        <span matPrefix>$&nbsp;</span>
        <mat-error *ngIf="form.get('amount')?.hasError('required')">
          El precio es requerido
        </mat-error>
        <mat-error *ngIf="form.get('amount')?.hasError('min')">
          El precio debe ser mayor a 0
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Cantidad</mat-label>
        <input matInput type="number" formControlName="quantity" min="1">
        <mat-error *ngIf="form.get('quantity')?.hasError('required')">
          La cantidad es requerida
        </mat-error>
        <mat-error *ngIf="form.get('quantity')?.hasError('min')">
          La cantidad debe ser al menos 1
        </mat-error>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Referencia (Opcional)</mat-label>
      <input matInput formControlName="reference" placeholder="Ej: Ticket #123">
    </mat-form-field>

    <div class="total-display">
      <span class="total-label">Total:</span>
      <span class="total-value">{{ total | currency }}</span>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="loading">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="loading">
    <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
    <span *ngIf="!loading">Agregar Cargo</span>
  </button>
</mat-dialog-actions>
