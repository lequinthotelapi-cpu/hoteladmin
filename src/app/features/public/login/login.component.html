<div class="page" fxLayout="column" fxLayoutAlign="center center">
  <div class="page-bg" aria-hidden="true"></div>

  <div [@fadeInUp] class="card glass-panel">
    <div class="brand" fxLayout="column" fxLayoutAlign="center center">
      <div class="logo-badge">
        <img src="assets/img/logo-round.jpeg" alt="Le Quint Hotel">
      </div>
      <div class="brand-title">Le Quint Hotel</div>
      <div class="brand-subtitle">Panel de gestión hotelera</div>
    </div>
    <div class="padding" fxLayout="column" fxLayoutGap="16px" [formGroup]="form">
      <div fxFlex="auto" fxLayout="column">
        <mat-form-field fxFlex="grow">
          <mat-label>Correo electrónico</mat-label>
          <input matInput required formControlName="email">
          <mat-error *ngIf="form.get('email').hasError('required')">Ingresa tu correo electrónico</mat-error>
        </mat-form-field>
        <mat-form-field fxFlex="grow">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="inputType" formControlName="password" required>
          <button type="button" mat-icon-button matSuffix (click)="toggleVisibility()" matTooltip="Mostrar/ocultar contraseña">
            <mat-icon *ngIf="visible">visibility</mat-icon>
            <mat-icon *ngIf="!visible">visibility_off</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password').hasError('required')">Ingresa tu contraseña</mat-error>
        </mat-form-field>
      </div>

      <div fxLayout="row" fxLayoutAlign="start center">
        <mat-checkbox class="caption" formControlName="rememberMe">Recordar usuario</mat-checkbox>
      </div>
      <button type="button" color="primary" mat-raised-button class="sign-in-btn" (click)="send()">
        Ingresar
      </button>
    </div>
  </div>
</div>
