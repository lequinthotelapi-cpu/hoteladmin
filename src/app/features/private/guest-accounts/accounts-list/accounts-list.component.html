<div class="accounts-container">
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <table mat-table [dataSource]="accounts" *ngIf="!loading && accounts.length > 0" class="accounts-table">
    <ng-container matColumnDef="roomNumber">
      <th mat-header-cell *matHeaderCellDef>Habitación</th>
      <td mat-cell *matCellDef="let account">
        <strong>{{ account.roomNumber }}</strong>
      </td>
    </ng-container>

    <ng-container matColumnDef="guestName">
      <th mat-header-cell *matHeaderCellDef>Huésped</th>
      <td mat-cell *matCellDef="let account">{{ account.guestName }}</td>
    </ng-container>

    <ng-container matColumnDef="checkInDate">
      <th mat-header-cell *matHeaderCellDef>Check-in</th>
      <td mat-cell *matCellDef="let account">{{ account.checkInDate | date:'short' }}</td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let account">{{ account.total | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="balance">
      <th mat-header-cell *matHeaderCellDef>Saldo</th>
      <td mat-cell *matCellDef="let account">
        <span [class.text-success]="account.balance === 0" [class.text-danger]="account.balance > 0">
          {{ account.balance | currency }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let account">
        <button mat-icon-button color="primary" (click)="viewAccount(account)" matTooltip="Ver Detalle">
          <mat-icon>visibility</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div *ngIf="!loading && accounts.length === 0" class="empty-state">
    <mat-icon>receipt_long</mat-icon>
    <p>No hay cuentas {{ status === 'open' ? 'abiertas' : 'cerradas' }}</p>
  </div>
</div>
