<fury-page-layout mode="card">
  <fury-page-layout-header>
    <fury-breadcrumbs current="Usuarios"></fury-breadcrumbs>
  </fury-page-layout-header>

  <fury-page-layout-content>
    <fury-list name="Usuarios" [columns]="columns" (filterChange)="onFilterChange($event)">
      <div class="actions">
        <button class="create" (click)="createUser()" type="button" mat-mini-fab color="primary">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <table [dataSource]="dataSource" mat-table matSort>
        
        <!-- Avatar Column -->
        <ng-container matColumnDef="avatar">
          <th mat-header-cell *matHeaderCellDef class="image-cell"></th>
          <td mat-cell *matCellDef="let user" class="image-cell">
            <img [src]="user.avatarUrl || 'assets/img/avatars/default.jpg'" 
                 class="user-avatar" 
                 [alt]="user.firstName">
          </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let user">
            <div class="user-name">
              <strong>{{user.firstName}} {{user.lastName}}</strong>
              <small>{{user.document}}</small>
            </div>
          </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let user">{{user.email}}</td>
        </ng-container>

        <!-- Role Column -->
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
          <td mat-cell *matCellDef="let user">
            <span class="role-badge" [ngClass]="getRoleBadgeClass(user.role)">
              {{user.role}}
            </span>
          </td>
        </ng-container>

        <!-- Active Column -->
        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
          <td mat-cell *matCellDef="let user">
            <mat-slide-toggle 
              [checked]="user.active" 
              [ngClass]="user.active ? 'toggle-active' : 'toggle-inactive'"
              (change)="toggleStatus(user, $event)"
              [disabled]="user.uid === processingUserId">
            </mat-slide-toggle>
            <span class="status-label">{{user.active ? 'Activo' : 'Inactivo'}}</span>
          </td>
        </ng-container>

        <!-- Sessions Column -->
        <ng-container matColumnDef="sessions">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Sesiones</th>
          <td mat-cell *matCellDef="let user">
            <div class="sessions-info">
              <span>{{user.activeSessionsCount || 0}} / {{user.maxSessions || 1}}</span>
              <mat-icon *ngIf="user.hasActiveSession" class="online-icon" matTooltip="Online">
                fiber_manual_record
              </mat-icon>
            </div>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-cell"></th>
          <td mat-cell *matCellDef="let user" class="actions-cell">
            <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
              <mat-icon>more_horiz</mat-icon>
            </button>
            <mat-menu #menu="matMenu" yPosition="below" xPosition="before">
              <button mat-menu-item (click)="editUser(user)">
                <mat-icon>edit</mat-icon>
                <span>Editar</span>
              </button>
              <button mat-menu-item (click)="resetSessions(user)" [disabled]="!user.activeSessionsCount || user.activeSessionsCount === 0">
                <mat-icon>refresh</mat-icon>
                <span>Resetear Sesiones</span>
              </button>
              <button mat-menu-item (click)="fixSessionRoles(user)" [disabled]="!user.activeSessionsCount || user.activeSessionsCount === 0">
                <mat-icon>build</mat-icon>
                <span>Corregir Roles de Sesiones</span>
              </button>
              <button mat-menu-item (click)="forceLogout(user)" [disabled]="!user.hasActiveSession">
                <mat-icon>logout</mat-icon>
                <span>Forzar Logout</span>
              </button>
              <button mat-menu-item (click)="deleteUser(user)">
                <mat-icon>delete</mat-icon>
                <span>Eliminar</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="visibleColumns"></tr>
        <tr mat-row 
            *matRowDef="let row; columns: visibleColumns;"
            (click)="editUser(row)"
            class="clickable"></tr>
      </table>

      <mat-paginator class="paginator" [pageSize]="pageSize"></mat-paginator>

    </fury-list>

  </fury-page-layout-content>
</fury-page-layout>
