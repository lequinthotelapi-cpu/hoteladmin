    <span fxFlex><!-- fill space --></span>

    <div fxFlexAlign="center" fxHide fxShow.gt-md>
      <button (click)="toggleCollapsed()" class="sidenav-toolbar-collapse-toggle" mat-icon-button>
        <mat-icon *ngIf="!collapsed" class="sidenav-toolbar-collapse-icon">radio_button_checked</mat-icon>
        <mat-icon *ngIf="collapsed" class="sidenav-toolbar-collapse-icon">radio_button_unchecked</mat-icon>
      </button>
    </div>
  </div>

  <fury-scrollbar class="sidenav-items" fxFlex="auto">
    <div *ngIf="sidenavUserVisible$ | async" class="sidenav-user">
      <img class="sidenav-user-image" [src]="userData?.avatarUrl || 'assets/img/avatars/default.jpg'">
      <h4 class="sidenav-user-name">{{ userData?.firstName || 'Usuario' }}</h4>
      <h5 class="sidenav-user-lastname">{{ userData?.lastName || '' }}</h5>
      <h5 class="sidenav-user-role">{{ getRoleLabel(userData?.role) }}</h5>

      <div class="sidenav-user-icons" fxLayout="row">
        <a *ngIf="hasAccess('/notifications') | async" [routerLink]="['/notifications']" mat-icon-button matTooltip="Enviar Notificaciones">
          <mat-icon>send</mat-icon>
        </a>
        <a *ngIf="hasAccess('/calendar') | async" [routerLink]="['/calendar']" mat-icon-button matTooltip="Calendario">
          <mat-icon>calendar_month</mat-icon>
        </a>
        <a (click)="logout()" mat-icon-button style="cursor: pointer;" matTooltip="Cerrar Sesión">
          <mat-icon>exit_to_app</mat-icon>
        </a>
      </div>
    </div>

    <fury-sidenav-item *ngFor="let item of items$ | async" [item]="item" [level]="0"></fury-sidenav-item>
  </fury-scrollbar>

  <div class="sidenav-footer">
    <button mat-button class="sidenav-config-button" (click)="openConfigPanel()">
      <mat-icon>settings</mat-icon>
      <span>Configuración</span>
    </button>
  </div>
</div>
