<h2 mat-dialog-title>Abrir Caja</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <p class="info-text">
      <mat-icon>info</mat-icon>
      Ingresa el monto inicial con el que abres la caja
    </p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Monto Inicial</mat-label>
      <input matInput type="number" formControlName="initialAmount" required min="0" step="0.01">
      <span matPrefix>$&nbsp;</span>
      <mat-error *ngIf="form.get('initialAmount')?.hasError('required')">
        El monto inicial es requerido
      </mat-error>
      <mat-error *ngIf="form.get('initialAmount')?.hasError('min')">
        El monto no puede ser negativo
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="loading">Cancelar</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="loading">
    <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
    <span *ngIf="!loading">Abrir Caja</span>
  </button>
</mat-dialog-actions>
